services:
  - type: web
    name: quizforge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false          # set this in the Render dashboard (never commit it)
      - key: LLM_API_URL
        value: https://integrate.api.nvidia.com/v1/chat/completions
      - key: LLM_MODEL
        value: nvidia/llama-3.1-nemotron-70b-instruct
